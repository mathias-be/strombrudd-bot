name: Ukentlig strømbrudd-statistikk

on:
  schedule:
    # Hver mandag 06:00 UTC (08:00 norsk sommertid). Justér ved behov.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dager:
        description: "Antall dager å oppsummere"
        default: "7"

concurrency:
  group: strombrudd-stats
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Send statistikk til Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python stats.py "${{ github.event.inputs.dager || '7' }}"
